<svg xmlns="http://www.w3.org/2000/svg" width="960" height="395" viewBox="0 0 960 395" role="img" aria-labelledby="title desc"><title id="title">BSP partition, room and corridor steps</title><desc id="desc">Three schematic panels show the same four regions A B C D, then rooms, then connecting paths.</desc><rect width="960" height="395" fill="#ffffff"/><g font-family="Arial, Helvetica, sans-serif"><text x="24" y="32" font-size="23" fill="#172b4d" text-anchor="start">From regions to connected rooms</text><text x="24" y="58" font-size="14" fill="#172b4d" text-anchor="start">Teaching schematic — not a trace of a particular seed</text><text x="24" y="94" font-size="18" fill="#172b4d" text-anchor="start">1. Partition</text><rect x="24" y="112" width="280" height="200" fill="#edf1f6" stroke="#52657d"/><rect x="24" y="112" width="140" height="90" fill="#e0ebff" stroke="none"/><rect x="24" y="202" width="140" height="110" fill="#d5f3e8" stroke="none"/><rect x="164" y="112" width="140" height="120" fill="#fff0c9" stroke="none"/><rect x="164" y="232" width="140" height="80" fill="#f3dff5" stroke="none"/><line x1="164" y1="112" x2="164" y2="312" stroke="#52657d" stroke-width="2" stroke-dasharray="6 5"/><line x1="24" y1="202" x2="164" y2="202" stroke="#52657d" stroke-width="2" stroke-dasharray="6 5"/><line x1="164" y1="232" x2="304" y2="232" stroke="#52657d" stroke-width="2" stroke-dasharray="6 5"/><text x="29" y="128" font-size="13" fill="#172b4d" text-anchor="start">A</text><text x="29" y="220" font-size="13" fill="#172b4d" text-anchor="start">B</text><text x="169" y="128" font-size="13" fill="#172b4d" text-anchor="start">C</text><text x="169" y="250" font-size="13" fill="#172b4d" text-anchor="start">D</text><text x="336" y="94" font-size="18" fill="#172b4d" text-anchor="start">2. Place rooms</text><rect x="336" y="112" width="280" height="200" fill="#edf1f6" stroke="#52657d"/><rect x="336" y="112" width="140" height="90" fill="#e0ebff" stroke="none"/><rect x="336" y="202" width="140" height="110" fill="#d5f3e8" stroke="none"/><rect x="476" y="112" width="140" height="120" fill="#fff0c9" stroke="none"/><rect x="476" y="232" width="140" height="80" fill="#f3dff5" stroke="none"/><rect x="354" y="130" width="85" height="50" fill="#147d69" stroke="none"/><rect x="366" y="232" width="90" height="56" fill="#147d69" stroke="none"/><rect x="506" y="137" width="84" height="65" fill="#147d69" stroke="none"/><rect x="511" y="257" width="80" height="40" fill="#147d69" stroke="none"/><line x1="476" y1="112" x2="476" y2="312" stroke="#52657d" stroke-width="2" stroke-dasharray="6 5"/><line x1="336" y1="202" x2="476" y2="202" stroke="#52657d" stroke-width="2" stroke-dasharray="6 5"/><line x1="476" y1="232" x2="616" y2="232" stroke="#52657d" stroke-width="2" stroke-dasharray="6 5"/><text x="341" y="128" font-size="13" fill="#172b4d" text-anchor="start">A</text><text x="341" y="220" font-size="13" fill="#172b4d" text-anchor="start">B</text><text x="481" y="128" font-size="13" fill="#172b4d" text-anchor="start">C</text><text x="481" y="250" font-size="13" fill="#172b4d" text-anchor="start">D</text><text x="648" y="94" font-size="18" fill="#172b4d" text-anchor="start">3. Connect siblings</text><rect x="648" y="112" width="280" height="200" fill="#edf1f6" stroke="#52657d"/><rect x="648" y="112" width="140" height="90" fill="#e0ebff" stroke="none"/><rect x="648" y="202" width="140" height="110" fill="#d5f3e8" stroke="none"/><rect x="788" y="112" width="140" height="120" fill="#fff0c9" stroke="none"/><rect x="788" y="232" width="140" height="80" fill="#f3dff5" stroke="none"/><rect x="666" y="130" width="85" height="50" fill="#147d69" stroke="none"/><rect x="678" y="232" width="90" height="56" fill="#147d69" stroke="none"/><rect x="818" y="137" width="84" height="65" fill="#147d69" stroke="none"/><rect x="823" y="257" width="80" height="40" fill="#147d69" stroke="none"/><line x1="708" y1="155" x2="723" y2="155" stroke="#172b4d" stroke-width="5"/><line x1="723" y1="155" x2="723" y2="260" stroke="#172b4d" stroke-width="5"/><line x1="860" y1="169" x2="863" y2="169" stroke="#172b4d" stroke-width="5"/><line x1="863" y1="169" x2="863" y2="277" stroke="#172b4d" stroke-width="5"/><line x1="708" y1="155" x2="860" y2="155" stroke="#172b4d" stroke-width="5"/><line x1="860" y1="155" x2="860" y2="169" stroke="#172b4d" stroke-width="5"/><line x1="788" y1="112" x2="788" y2="312" stroke="#52657d" stroke-width="2" stroke-dasharray="6 5"/><line x1="648" y1="202" x2="788" y2="202" stroke="#52657d" stroke-width="2" stroke-dasharray="6 5"/><line x1="788" y1="232" x2="928" y2="232" stroke="#52657d" stroke-width="2" stroke-dasharray="6 5"/><text x="653" y="128" font-size="13" fill="#172b4d" text-anchor="start">A</text><text x="653" y="220" font-size="13" fill="#172b4d" text-anchor="start">B</text><text x="793" y="128" font-size="13" fill="#172b4d" text-anchor="start">C</text><text x="793" y="250" font-size="13" fill="#172b4d" text-anchor="start">D</text><text x="24" y="345" font-size="14" fill="#172b4d" text-anchor="start">Dashed lines: partition boundaries. Green: rooms. Dark paths: inclusive L-shaped corridors.</text><text x="24" y="370" font-size="14" fill="#172b4d" text-anchor="start">Join A–B and C–D, then join A–C to connect both subtrees. Boundaries are not necessarily walls.</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="395" viewBox="0 0 960 395" role="img" aria-labelledby="title desc"><title id="title">The binary tree behind the four-region example</title><desc id="desc">One root has left and right children; those have room leaves A B and C D respectively.</desc><rect width="960" height="395" fill="#ffffff"/><g font-family="Arial, Helvetica, sans-serif"><text x="24" y="32" font-size="23" fill="#172b4d" text-anchor="start">The spatial splits form a binary tree</text><line x1="480" y1="104" x2="250" y2="170" stroke="#52657d" stroke-width="2"/><line x1="480" y1="104" x2="710" y2="170" stroke="#52657d" stroke-width="2"/><line x1="250" y1="204" x2="135" y2="270" stroke="#52657d" stroke-width="2"/><line x1="250" y1="204" x2="365" y2="270" stroke="#52657d" stroke-width="2"/><line x1="710" y1="204" x2="595" y2="270" stroke="#52657d" stroke-width="2"/><line x1="710" y1="204" x2="825" y2="270" stroke="#52657d" stroke-width="2"/><rect x="385" y="70" width="190" height="40" fill="#edf1f6" stroke="#52657d"/><text x="480" y="96" font-size="16" fill="#172b4d" text-anchor="middle">Whole interior</text><rect x="155" y="170" width="190" height="40" fill="#edf1f6" stroke="#52657d"/><text x="250" y="196" font-size="16" fill="#172b4d" text-anchor="middle">Left region</text><rect x="615" y="170" width="190" height="40" fill="#edf1f6" stroke="#52657d"/><text x="710" y="196" font-size="16" fill="#172b4d" text-anchor="middle">Right region</text><rect x="40" y="270" width="190" height="40" fill="#e0ebff" stroke="#52657d"/><text x="135" y="296" font-size="16" fill="#172b4d" text-anchor="middle">Room A</text><rect x="270" y="270" width="190" height="40" fill="#d5f3e8" stroke="#52657d"/><text x="365" y="296" font-size="16" fill="#172b4d" text-anchor="middle">Room B</text><rect x="500" y="270" width="190" height="40" fill="#fff0c9" stroke="#52657d"/><text x="595" y="296" font-size="16" fill="#172b4d" text-anchor="middle">Room C</text><rect x="730" y="270" width="190" height="40" fill="#f3dff5" stroke="#52657d"/><text x="825" y="296" font-size="16" fill="#172b4d" text-anchor="middle">Room D</text><text x="24" y="345" font-size="15" fill="#172b4d" text-anchor="start">Internal nodes: split regions. Leaves: carve rooms. Return one floor point from each subtree.</text><text x="24" y="372" font-size="15" fill="#172b4d" text-anchor="start">This implementation keeps the tree in recursive calls; it does not allocate persistent tree nodes.</text></g></svg>
